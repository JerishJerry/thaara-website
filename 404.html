<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191611">
  <meta name="color-scheme" content="dark">
  <title>Page not found — THAARA</title>
  <meta name="description" content="That page doesn't exist. Return to THAARA.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main id="main" class="section notfound">
    <div class="container container--narrow">
      <div class="notfound-inner">
        <picture>
          <source type="image/webp" srcset="logo-128.webp 128w, logo-256.webp 256w" sizes="112px">
          <img src="logo-256.png" alt="THAARA" class="footer-logo" width="256" height="197" decoding="async">
        </picture>

        <span class="eyebrow">404</span>
        <h1>This page doesn&rsquo;t exist.</h1>
        <p class="lead">The link may be out of date, or the address slightly off.</p>

        <div class="btn-row">
          <!-- Absolute, matching the canonical in index.html. A root-relative
               "/" would land on the wrong place under a project path, and "./"
               resolves against the missing URL rather than the site root.
               Update this together with the canonical if the domain changes. -->
          <a class="btn btn--primary" href="https://jerishjerry.github.io/thaara-website/">Back to THAARA <i class="arrow" aria-hidden="true">↗</i></a>
          <a class="btn btn--secondary" href="https://www.instagram.com/thaara.creates" target="_blank" rel="noopener noreferrer">Instagram <i class="arrow" aria-hidden="true">↗</i></a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
